[env:arduino]
platform = nordicnrf52
board = nano33ble
framework = arduino
lib_deps = 
    arduino-libraries/PDM
    https://github.com/ChiraleBrandon/Chirale_TensorFlowLite.git

[platformio]
default_envs = arduino
